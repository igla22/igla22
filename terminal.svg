<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 605" width="100%" height="100%">

  <rect width="800" height="800" fill="#000000" />
  
  <style>
    .txt { font-family: 'Ubuntu Mono', 'Courier New', Courier, monospace; font-size: 16px; fill: #FFFFFF; }
    .prompt { fill: #8AE234; font-weight: bold; } 
    .cursor { fill: #FFFFFF; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>


  <text x="20" y="40" class="txt">
    <tspan class="prompt">igla@github</tspan>:~$ cat MarioZ.txt
  </text>
  <text x="20" y="65" class="txt">Hi, I'm Mario and this is my GitHub page.</text>
  <text x="20" y="115" class="txt">I'm a Communications Engineering MSc student at Politecnico di Torino</text>
  <text x="20" y="140" class="txt">with a bachelor degree in Computer Engineering at UniSa.</text>
  <text x="20" y="190" class="txt">I have a strong interest in networking, telecommunications, and computer</text>
  <text x="20" y="215" class="txt">science and I am constantly driven by curiosity to learn more about this</text>
  <text x="20" y="240" class="txt">world.</text>


  <text x="20" y="290" class="txt">
    <tspan class="prompt">igla@github</tspan>:~$ cat skills.yaml
  </text>
  <text x="20" y="315" class="txt">programming: [Python, MatLab, C, Java]</text>
  <text x="20" y="340" class="txt">scripting: [Bash]</text>
  <text x="20" y="365" class="txt">databases: [SQL]</text>
  <text x="20" y="390" class="txt">devops_and_os: [Git, Docker, Linux]</text>
  <text x="20" y="415" class="txt">networking: [Wireshark, GNS3]</text>

  <text x="20" y="465" class="txt">
    <tspan class="prompt">igla@github</tspan>:~$ cat extra.txt
  </text>
  <text x="20" y="490" class="txt">Here I'll share materials from my university studies, as well as my</text>
  <text x="20" y="515" class="txt">personal projects and experiments.</text>

  <text x="20" y="565" class="txt">
    <tspan class="prompt">igla@github</tspan>:~$ <tspan class="cursor">█</tspan>
  </text>
</svg>
